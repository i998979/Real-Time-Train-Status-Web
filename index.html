    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        function encryptInput(input, key) {
            const cryptoKey = CryptoJS.MD5(key);
            const cryptoIv = CryptoJS.enc.Utf8.parse('0000000000000000');

            return CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse(input), cryptoKey, {
                iv: cryptoIv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7
            }).toString();
        }

        function decryptInput(encryptedInput, key) {
            const cryptoKey = CryptoJS.MD5(key);
            const cryptoIv = CryptoJS.enc.Utf8.parse('0000000000000000');

            const cipherParams = CryptoJS.lib.CipherParams.create({
                ciphertext: CryptoJS.enc.Base64.parse(encryptedInput)
            });

            const decrypted = CryptoJS.AES.decrypt(cipherParams, cryptoKey, {
                iv: cryptoIv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7
            });

            return decrypted.toString(CryptoJS.enc.Utf8);
        }
    </script>
